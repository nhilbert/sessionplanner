<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tile { fill: #5d5a8a } .mark { stroke: #faf9f6 }
    @media (prefers-color-scheme: dark) { .tile { fill: #a3a0cc } .mark { stroke: #171716 } }
  </style>
  <rect class="tile" width="64" height="64" rx="14"/>
  <g class="mark" fill="none" stroke-linecap="round">
    <!-- the agenda: three blocks of different length -->
    <path d="M14 21 H31 M14 33 H25 M14 45 H39" stroke-width="6"/>
    <!-- a fixed time -->
    <circle cx="45" cy="25" r="6" stroke-width="5"/>
  </g>
</svg>
