<section class="sheet">
  <header>
    <div class="eyebrow">Beispiel · Ordnen und Einschätzen</div>
    <h1>Unser Team im Blick</h1>
  </header>
  <div class="block grid g-wide h-80">
    <div class="field"><p class="prompt">Was verbindet uns?</p></div>
    <div class="field"><p class="prompt">Das läuft gut …</p></div>
    <div class="field"><p class="prompt">Das wünschen wir uns …</p></div>
    <div class="field center big"><p>JETZT</p></div>
    <div class="field center big"><p>SPÄTER</p></div>
  </div>
  <div class="block rows">
    <div class="row h-20"><h3>Beobachtung</h3><p class="prompt">Was habe ich gesehen oder gehört?</p></div>
    <div class="row h-20"><h3>Wirkung</h3><p class="prompt">Was hat das bei mir ausgelöst?</p><div class="write lines-1"></div></div>
  </div>
  <div class="block criteria">
    <div class="crit h-25"><p class="label">Einschätzung</p><span class="score">/10</span><h3>Zusammenarbeit</h3><p class="note">Was trägt?</p><p class="note">Was fehlt?</p></div>
  </div>
  <div class="block pair fill">
    <div><div class="block circle fill"><ol><li></li><li></li><li></li><li></li><li></li><li></li></ol><p class="middle"><span class="blank short"></span> %</p></div></div>
    <div><table class="block table boxed tall"><thead><tr><th>Wer</th><th>Was</th></tr></thead><tbody><tr><td></td><td></td></tr><tr><td></td><td></td></tr><tr><td></td><td></td></tr></tbody></table></div>
  </div>
</section>
